# Retained preliminary Stage 4/5 baseline; not the final Stage 3 method.
# Apply this model block over the frozen BEVFusion config only for later comparison.
model:
  stage3:
    mode: full
    in_channels: [80, 256]
    hidden_channels: 32
    gate_scale: 0.5
    freeze_base: true
    fuser_trainable: false
    reliability_pos_weight: 1.0
    conflict_pos_weight: 4.0
    lambda_rel: 1.0
    lambda_conf: 1.0
    lambda_clean: 0.1
